<!-- @dsCard group="Components" viewport="700x260" name="Brand — Wordmark, SiteFooter" subtitle="The wordmark with stacked and inline division sublines, and the deep-teal brand footer with the firm tagline" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #fff; }
  .marks { display: flex; align-items: flex-end; gap: 34px; padding: 24px 26px 22px; }
  .navy { background: var(--brand-navy); padding: 18px 26px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Wordmark, SiteFooter } = window[Object.keys(window).find(k => /^TDHDesignSystem/.test(k))];
function Demo() {
  return (
    <div>
      <div className="marks">
        <Wordmark size="lg" />
        <Wordmark subline="Engineering" size="md" />
        <Wordmark subline="Permitting & Reg" size="sm" />
        <Wordmark subline="Construction" inline size="sm" />
      </div>
      <div className="navy"><Wordmark subline="AI Hub" inline size="sm" onDark /></div>
      <SiteFooter links={[{ label: 'Acceptable use' }, { label: 'Support' }]} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
