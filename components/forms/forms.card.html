<!-- @dsCard group="Components" viewport="700x290" name="Forms — Input, Select, Textarea" subtitle="Labeled fields with mono labels, teal focus, hint and error states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 26px 30px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 22px; align-items: start; }
  .span { grid-column: 1 / -1; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Select, Textarea } = window[Object.keys(window).find(k => /^(TDH)?DesignSystem_/.test(k))];
function Demo() {
  return (
    <div className="grid">
      <Input label="Full name" placeholder="Jane Engineer" required />
      <Input label="Email" type="email" defaultValue="jane@tdh.com" hint="We'll only use this to reply." />
      <Select label="Service line" defaultValue="Civil">
        <option>Civil</option><option>Structural</option><option>Environmental</option><option>Transportation</option>
      </Select>
      <Input label="Phone" defaultValue="406-12" error="Enter a valid phone number." />
      <div className="span"><Textarea label="Project description" rows={3} placeholder="A sentence or two is plenty…" /></div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
