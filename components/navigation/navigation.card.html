<!-- @dsCard group="Components" viewport="700x670" name="Navigation — AppShell, PlatformBar, Breadcrumb, SectionHeader" subtitle="The full product frame: navy platform rail, white sidebar with orange active rule, gridded content, and the teal brand footer" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: var(--font-sans); background: #fff; }
  .tdh-shell, .tdh-shellwrap { min-height: 0 !important; }
  h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; color: var(--brand-ink); margin: 8px 0 6px; }
  h2 .amp { color: var(--brand-orange); }
  .lead { font-size: 13.5px; line-height: 1.55; color: #2c454d; margin: 0 0 16px; max-width: 380px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { AppShell, PlatformBar, Breadcrumb, SectionHeader, Button, Card, Eyebrow, SiteFooter } = window[Object.keys(window).find(k => /^(TDH)?DesignSystem_/.test(k))];

function LI({ name, size = 17 }) {
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '<i data-lucide="' + name + '"></i>';
      window.lucide.createIcons({ attrs: { width: size, height: size, 'stroke-width': 2 }, nameAttr: 'data-lucide' });
    }
  }, [name, size]);
  return <span ref={ref} style={{ display: 'inline-flex', lineHeight: 0 }} />;
}

const NAV = [
  { id: 'overview', label: 'Overview', icon: <LI name="layout-grid" /> },
  { id: 'guided', label: 'Guided Review', icon: <LI name="clipboard-list" /> },
  { id: 'saved', label: 'Saved Reviews', icon: <LI name="folder" /> },
  { id: 'regs', label: 'Regulations', icon: <LI name="book-open" /> },
];

function Demo() {
  const [active, setActive] = React.useState('overview');
  return (
    <AppShell
      platformBar={<PlatformBar eyebrow="TDH AI" title="TDH AI Platform" />}
      product="Permitting & Reg"
      nav={NAV}
      activeId={active}
      onNavigate={setActive}
      cta={<Button variant="accent" iconLeft={<LI name="plus" size={15} />}>New Review</Button>}
      sidebarMeta={<>TDH AI Platform<br />P&amp;R Module · Internal use</>}
      breadcrumb={<Breadcrumb items={['P&R', 'Permitting & Regulatory']} />}
      contentFooter={<SiteFooter division="Engineering" />}
    >
      <Eyebrow number={1}>Permitting &amp; Regulatory</Eyebrow>
      <h2>Permitting <span className="amp">&amp;</span> Regulatory</h2>
      <p className="lead">Guided reviews grounded in ingested regulations, with the gaps documented.</p>
      <SectionHeader tone="desk" icon={<LI name="clipboard-list" />} title="At the desk" meta={['Opens here in the hub', 'Sources cited']} />
      <div style={{ marginTop: 14 }}>
        <Card footer={<Button variant="accent" size="sm" iconRight={<LI name="arrow-right" size={14} />}>Begin review</Button>}>
          <Eyebrow tone="muted" tick={false}>Start here</Eyebrow>
          <strong style={{ display: 'block', fontSize: 16, margin: '7px 0 6px' }}>New guided review</strong>
          <p style={{ margin: 0, fontSize: 13, lineHeight: 1.5, color: 'var(--brand-slate)' }}>Locate the project on the map. Prefilled answers carry source badges.</p>
        </Card>
      </div>
    </AppShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
