<!-- @dsCard group="Type" viewport="700x180" name="Mono & eyebrows — Space Mono" subtitle="Uppercase, letter-spaced Space Mono for labels, data and technical tags — one color per label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 28px 32px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 10px; font-family: var(--font-mono); font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-teal); }
  .tick { width: 22px; height: 2px; background: currentColor; }
  .data { font-family: var(--font-mono); font-size: 28px; font-weight: 700; letter-spacing: -.01em; margin-top: 14px; color: var(--brand-teal); }
  .data small { font-size: 13px; font-weight: 400; opacity: .5; letter-spacing: .04em; }
  .tags { display: flex; gap: 8px; margin-top: 16px; }
  .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 5px 9px; border: 1px solid var(--brand-hairline); border-radius: 3px; color: var(--brand-slate); }
</style>
</head>
<body>
  <div class="eyebrow"><span class="tick"></span>News &amp; insight · est. 1965</div>
  <div class="data">#0E4E5E <small>// brand.teal</small></div>
  <div class="tags"><span class="tag">Civil</span><span class="tag">Structural</span><span class="tag">Environmental</span></div>
</body>
</html>
