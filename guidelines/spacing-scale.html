<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing scale" subtitle="8px base grid with a 4px half-step — the engineered rhythm" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 26px 32px; }
  .scale { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { width: 22px; background: var(--brand-teal); border-radius: 2px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--brand-slate); }
</style>
</head>
<body>
  <div class="scale">
    <div class="item"><div class="bar" style="height:4px"></div><span class="lab">1·4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="lab">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="lab">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="lab">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="lab">5·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="lab">6·32</span></div>
    <div class="item"><div class="bar" style="height:40px"></div><span class="lab">7·40</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="lab">8·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="lab">9·64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="lab">10·80</span></div>
  </div>
</body>
</html>
