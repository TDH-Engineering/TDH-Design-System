<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 28px 32px; }
  p { margin: 0 0 12px; max-width: 560px; }
  .lead { font-size: 18px; line-height: 1.55; font-weight: 500; }
  .body { font-size: 16px; line-height: 1.6; color: #243b42; }
  .cap { font-size: 13px; line-height: 1.5; color: var(--brand-slate); }
</style>
</head>
<body>
  <p class="lead">We assign professionals who understand the issues and deliver results.</p>
  <p class="body">TD&amp;H has satisfied clients since 1965, building an impressive resume of civil, structural, and environmental projects across five states.</p>
  <p class="cap">Caption · 13px · slate — for metadata, photo credits, and fine print.</p>
</body>
</html>
