<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 28px 32px; }
  .d1 { font-size: 56px; font-weight: 800; letter-spacing: -.02em; line-height: 1.0; margin: 0; }
  .d2 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; line-height: 1.1; margin: 14px 0 0; color: var(--brand-teal); }
  .meta { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--brand-slate); margin-top: 16px; }
</style>
</head>
<body>
  <p class="d1">Engineering solutions</p>
  <p class="d2">to challenging technical problems</p>
  <div class="meta">Archivo · 800 / 700 · tracking −0.02em</div>
</body>
</html>
