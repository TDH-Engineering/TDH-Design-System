<!-- @dsCard group="Brand" viewport="700x210" name="Blueprint grid" subtitle="One universal pitch — 96×96px on page surfaces only, never inside cards or banners" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); color: var(--brand-ink); }
  .pane { padding: 26px 24px; min-height: 200px; background: #fff; background-image: linear-gradient(var(--brand-grid) 1px, transparent 1px), linear-gradient(90deg, var(--brand-grid) 1px, transparent 1px); background-size: var(--grid-cell) var(--grid-cell); }
  .lbl { font-family: var(--font-mono); font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--brand-teal); }
  h3 { margin: 8px 0 5px; font-size: 21px; font-weight: 800; letter-spacing: -.015em; }
  p { margin: 0; font-size: 12px; color: var(--brand-slate); font-family: var(--font-mono); }
  .card { background: var(--brand-teal); color: #fff; padding: 14px 16px; margin-top: 18px; max-width: 300px; }
  .card .lbl { color: var(--brand-taupe-light); }
  .card p { color: #c2d4d6; margin-top: 4px; }
</style>
</head>
<body>
  <div class="pane">
    <div class="lbl">Page surface · 96px</div>
    <h3>One grid, everywhere</h3>
    <p>--grid-cell</p>
    <div class="card"><div class="lbl">Card / banner</div><p>No grid inside nested surfaces.</p></div>
  </div>
</body>
</html>
