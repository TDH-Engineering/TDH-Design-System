<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Archivo ramp from 80px display to 14px caption" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-sans); background: #fff; color: var(--brand-ink); padding: 24px 32px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 5px 0; border-bottom: 1px solid var(--brand-mist); }
  .row:last-child { border-bottom: 0; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--brand-slate); width: 96px; flex: none; letter-spacing: .04em; }
  .spec { font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
</style>
</head>
<body>
  <div class="row"><span class="tok">3xl · 48</span><span class="spec" style="font-size:40px">Aa Headline</span></div>
  <div class="row"><span class="tok">2xl · 36</span><span class="spec" style="font-size:30px">Aa Section</span></div>
  <div class="row"><span class="tok">xl · 28</span><span class="spec" style="font-size:24px">Aa Subhead</span></div>
  <div class="row"><span class="tok">lg · 22</span><span class="spec" style="font-size:20px">Aa Title</span></div>
  <div class="row"><span class="tok">base · 16</span><span class="spec" style="font-size:16px;font-weight:400">Aa Body copy</span></div>
  <div class="row"><span class="tok">sm · 14</span><span class="spec" style="font-size:14px;font-weight:400;color:var(--brand-slate)">Aa Caption</span></div>
</body>
</html>
